name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  example:
    name: Build and test the ${{ matrix.example }} example
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [todo, market, solitaire]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No lockfile is exported, so resolution is fresh on every run.
      - run: yarn install
      - run: yarn workspace example-${{ matrix.example }} build
      - run: yarn workspace example-${{ matrix.example }} test
