name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-finished deploy
# would leave the published site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      - name: Test site assembly
        run: node --test .github/pages/assemble-site.test.mjs
      - run: yarn install
      # A relative base keeps the built asset URLs independent of where the
      # site is served, so a rename or a fork does not break the demo.
      - name: Build the examples
        run: |
          for example in todo market solitaire magic-ball password 20-questions; do
            yarn workspace "example-$example" build --base=./
          done
      - name: Assemble the site
        run: node .github/pages/assemble-site.mjs
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
